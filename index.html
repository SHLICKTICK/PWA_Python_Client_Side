<!DOCTYPE html>
<html>
<head>
    <title>PWA Python Shell</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <h1>Python Shell Interface</h1>
    <input type="text" id="input_data" placeholder="Enter data/commands...">
    <button onclick="executeCommand()">Execute Shell Command</button>
    <pre id="output_log">Shell output will appear here.</pre>

    <!-- 1. Load Pyodide -->
    <!-- <script src="https://cdn.jsdelivr.net/pyodide/v2.x/full/pyodide.js"></script> -->
    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
    <script>
        // Your main application logic will go here
        async function setupPythonEnvironment() {
            // 2. Initialize Pyodide
            let pyodide = await loadPyodide();

            // 3. Expose Pyodide's scope to JavaScript for easier calling
            window.pyodide = pyodide; 
            console.log("Python interpreter loaded successfully.");
        }

        // Call this function when the PWA loads
        setupPythonEnvironment();
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(()=> {
                console.log('Service Worker registered successfully.');
            }).catch((error) => {
                console.error('Service Worker registration failed:', error);
            });
        }
    </script>

    <script src="the_glue.js"></script> <!-- Your custom logic -->
</body>
</html>
